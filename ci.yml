name: Build and test with MySQL
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/petdb
      DB_USER: root
      DB_PASS: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: Create database and tables
        run: mysql -h127.0.0.1 -uroot -proot < sql/schema.sql
      - name: Compile
        run: mvn -B -q compile
      - name: Run headless smoke test against MySQL
        run: mvn -B -q exec:java -Dexec.mainClass=petadoption.SmokeTest
